<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GateKeepr</title>
    <script>
      try {
        const s = JSON.parse(localStorage.getItem("screening-ui") || "{}");
        const t = s.state && s.state.theme;
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches) || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
